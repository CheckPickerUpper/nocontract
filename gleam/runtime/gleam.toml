name = "nocontract_runtime"
version = "0.1.0"
target = "erlang"
gleam = ">= 1.19.2 and < 2.0.0"
description = "Typed request parsing for NoContract's generated Gleam servers"
licences = ["MIT"]
repository = { type = "github", user = "CheckPickerUpper", repo = "nocontract" }

[dependencies]
gleam_stdlib = ">= 1.1.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
wisp = ">= 2.2.2 and < 3.0.0"
mist = ">= 6.0.3 and < 7.0.0"

[dev_dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
